# アプリケーション名
spring.application.name=work-with

# Renderなどのホスティング先が割り当てるPORT環境変数に対応します。
# ローカル実行時はこれまで通り8080番になります。
server.port=${PORT:8080}

# プロジェクト直下のdbフォルダへSQLiteファイルを作成します。
spring.datasource.url=jdbc:sqlite:./db/work-with.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLiteは1ファイルを使用するため、接続数を小さく保ちます。
spring.datasource.hikari.maximum-pool-size=1

# SQLiteでは接続ごとに外部キー制約を有効にする必要があります。
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# 起動するたびにschema.sqlを実行します。
# CREATE TABLE IF NOT EXISTSを使用しているため、既存テーブルは削除されません。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# 開発中にSQLを確認しやすくする設定です。
logging.level.org.springframework.jdbc.core=DEBUG

# ログイン状態を保持するHttpSessionの有効期限です。操作がない状態で30分経つと失効します。
server.servlet.session.timeout=30m

# JSESSIONIDをJavaScriptから読み取れないHttpOnly Cookieにします。
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
