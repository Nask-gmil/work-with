# アプリケーション名
spring.application.name=work-with

# 発表・評価用の固定テストアカウントを起動時に自動作成します。
# 発表期間が終わったらfalseに変更してください（TestAccountSeeder.javaも参照）。
test-account.enabled=true

# Renderなどのホスティング先が割り当てるPORT環境変数に対応します。
# ローカル実行時はこれまで通り8080番になります。
server.port=${PORT:8080}

# プロジェクト直下のdbフォルダへSQLiteファイルを作成します。
spring.datasource.url=jdbc:sqlite:./db/work-with.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLiteは1ファイルを使用するため、接続数を小さく保ちます。
spring.datasource.hikari.maximum-pool-size=1

# SQLiteでは接続ごとに外部キー制約を有効にする必要があります。
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# 起動するたびにschema.sqlを実行します。
# CREATE TABLE IF NOT EXISTSを使用しているため、既存テーブルは削除されません。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# 開発中にSQLを確認しやすくする設定です。
logging.level.org.springframework.jdbc.core=DEBUG

# ログイン状態を保持するHttpSessionの有効期限です。操作がない状態で30分経つと失効します。
server.servlet.session.timeout=30m

# JSESSIONIDをJavaScriptから読み取れないHttpOnly Cookieにします。
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# 新規登録APIのIP別Rate Limitです。Renderでは環境変数から変更できます。
registration.rate-limit.max-attempts=${REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS:10}
registration.rate-limit.window-seconds=${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:600}

# 正規化済みusernameとクライアントIPの組み合わせ単位のログイン失敗Rate Limitです。
login.rate-limit.max-failures=${LOGIN_RATE_LIMIT_MAX_FAILURES:10}
login.rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}

# Turnstileのキーはリポジトリへ保存せず、環境変数から受け取ります。
# 未設定の場合も検証を迂回せず、新規登録を503で拒否します。
turnstile.site-key=${TURNSTILE_SITE_KEY:}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# ログインユーザー単位の部屋操作Rate Limitです。
room.create.rate-limit.max-attempts=${ROOM_CREATE_RATE_LIMIT_MAX_ATTEMPTS:2}
room.create.rate-limit.window-seconds=${ROOM_CREATE_RATE_LIMIT_WINDOW_SECONDS:3600}
room.join.rate-limit.max-attempts=${ROOM_JOIN_RATE_LIMIT_MAX_ATTEMPTS:10}
room.join.rate-limit.window-seconds=${ROOM_JOIN_RATE_LIMIT_WINDOW_SECONDS:900}

# ログインユーザー単位のチャット・DM送信Rate Limitです。両者は別々に数えます。
chat.rate-limit.max-attempts=${CHAT_RATE_LIMIT_MAX_ATTEMPTS:10}
chat.rate-limit.window-seconds=${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}
dm.rate-limit.max-attempts=${DM_RATE_LIMIT_MAX_ATTEMPTS:15}
dm.rate-limit.window-seconds=${DM_RATE_LIMIT_WINDOW_SECONDS:60}

# ログインユーザー単位の状態・アバター再変更・作業内容変更Rate Limitです。
status.rate-limit.max-attempts=${STATUS_RATE_LIMIT_MAX_ATTEMPTS:10}
status.rate-limit.window-seconds=${STATUS_RATE_LIMIT_WINDOW_SECONDS:300}
avatar.rate-limit.max-attempts=${AVATAR_RATE_LIMIT_MAX_ATTEMPTS:10}
avatar.rate-limit.window-seconds=${AVATAR_RATE_LIMIT_WINDOW_SECONDS:300}
work-content.rate-limit.max-attempts=${WORK_CONTENT_RATE_LIMIT_MAX_ATTEMPTS:20}
work-content.rate-limit.window-seconds=${WORK_CONTENT_RATE_LIMIT_WINDOW_SECONDS:600}

# DBデータの保存期間と、自動削除処理の実行間隔です。
retention.chat-hours=${CHAT_RETENTION_HOURS:24}
retention.private-room-days=${PRIVATE_ROOM_RETENTION_DAYS:14}
retention.cleanup-interval-milliseconds=${RETENTION_CLEANUP_INTERVAL_MILLISECONDS:3600000}
retention.cleanup-initial-delay-milliseconds=${RETENTION_CLEANUP_INITIAL_DELAY_MILLISECONDS:60000}

# 同一のセキュリティイベントによるログ大量出力を抑制する時間です。
security.logging.suppression-seconds=${SECURITY_LOG_SUPPRESSION_SECONDS:60}
